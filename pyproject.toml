[project]
name = "original-thought"
version = "0.1.0"
description = "Research project: will AI ever be able to have original ideas?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.44",
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "tqdm>=4.68.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/original_thought"]
